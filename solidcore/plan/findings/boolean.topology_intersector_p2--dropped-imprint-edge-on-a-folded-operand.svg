    <text transform="matrix(1 0 0 1 24 610)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">Section by the plane of the tool&apos;s top face, near the nose, drawn in that plane (0.1 mm = 64 pt).</tspan></text>
    <text transform="matrix(1 0 0 1 24 628)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">The cavity&apos;s loft strips fold: strip 2 runs in from the tool&apos;s edge to B, strip 3 back to C, strip 4 in again to D.</tspan></text>
    <text transform="matrix(1 0 0 1 24 646)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">Without the piece from C to D the intersection has a gap, and the faces on both sides of it were classified as one.</tspan></text>
    <text transform="matrix(1 0 0 1 24 664)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">The other side of the nose (y &lt; 0) is the mirror image.</tspan></text>
  </g>
</svg>
